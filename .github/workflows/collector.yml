name: private collection
on:
  schedule: [{cron: '23 */4 * * *'}]
  workflow_dispatch:
concurrency:
  group: sufe-ems-collection
  cancel-in-progress: false
permissions: {contents: read, issues: write}
jobs:
  collect:
    runs-on: self-hosted
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m collector collect --slot now
        env:
          SUFE_EMS_TOKEN: '${{ secrets.SUFE_EMS_TOKEN }}'
          SUFE_EMS_COOKIE: '${{ secrets.SUFE_EMS_COOKIE }}'
          SUFE_EMS_REFERER: '${{ secrets.SUFE_EMS_REFERER }}'
      - run: python -m collector export
      - run: python scripts/validate_public.py

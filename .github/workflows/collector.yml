name: private collection

on:
  # GitHub cron uses UTC. 15:00 UTC is 23:00 in Asia/Shanghai.
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the sanitized public-data snapshot
        required: false
        default: true
        type: boolean

concurrency:
  group: sufe-ems-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    # GitHub creates a fresh cloud VM for each run. Credentials stay in Secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      TZ: Asia/Shanghai
      SUFE_EMS_TOKEN: ${{ secrets.SUFE_EMS_TOKEN }}
      SUFE_EMS_COOKIE: ${{ secrets.SUFE_EMS_COOKIE }}
      SUFE_EMS_REFERER: ${{ secrets.SUFE_EMS_REFERER }}
      SUFE_REQUESTS_PER_SECOND: '10'
      SUFE_ALLOW_HIGH_RATE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Check required secret without printing it
        shell: bash
        run: |
          if [ -z "${SUFE_EMS_TOKEN:-}" ]; then
            echo 'SUFE_EMS_TOKEN is not configured in GitHub Secrets' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect into private SQLite
        run: python -m collector collect --slot now

      - name: Export and validate sanitized public data
        run: |
          python -m collector export
          python scripts/validate_public.py

      - name: Commit and publish public data
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        shell: bash
        run: |
          git config user.name 'sufe-power-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Intraday is ignored for ordinary local runs, but it is required by
          # the public trend page and is safe only after exporter validation.
          git add public-data/v1
          if [ -d public-data/v1/intraday ]; then
            git add -f public-data/v1/intraday
          fi
          if git diff --cached --quiet; then
            echo 'No public data changes to publish'
            exit 0
          fi
          git commit -m "data: publish collection $(date --iso-8601=seconds)"
          git push origin HEAD:main

      - name: Upload non-sensitive run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-run-${{ github.run_id }}
          path: var/logs/
          if-no-files-found: ignore
          retention-days: 7
